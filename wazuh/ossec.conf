<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
    <max_output_size>67108864</max_output_size>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <directories check_all="yes" realtime="yes" report_changes="yes">/home</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/root</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/tmp</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
  </syscheck>

  <vulnerability-detector>
    <enabled>no</enabled>
  </vulnerability-detector>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
  </auth>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <integration>
    <name>shuffle</name>
    <hook_url>http://13.237.62.182:3001/api/v1/hooks/webhook_08676527-8e7f-47df-af6a-b979663f899f</hook_url>
    <rule_id>86601,100400,510,5402,5403,17101,17102,100200,100201,100205</rule_id>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
